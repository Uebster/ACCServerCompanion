<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="pt-BR" x-data="accApp()" x-init="init()">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ACC Server Manager</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <h1>🏁 ACC Tool</h1>
            <ul>
                <li @click="activeTab='network'" :class="{active: activeTab=='network'}">Rede</li>
                <li @click="activeTab='server'" :class="{active: activeTab=='server'}">Servidor</li>
                <li @click="activeTab='event'" :class="{active: activeTab=='event'}">Evento</li>
                <li @click="activeTab='rules'" :class="{active: activeTab=='rules'}">Regras</li>
                <li @click="activeTab='advanced'" :class="{active: activeTab=='advanced'}">Avançado</li>
            </ul>
            <div class="sidebar-actions">
                <button @click="startServer()" class="btn-start">▶ START SERVER</button>
                <button @click="createShortcut()" class="btn-shortcut">📎 Criar Atalho</button>
                <button @click="loadPreset()" class="btn-preset">📂 Carregar Preset</button>
                <button @click="savePreset()" class="btn-preset">💾 Salvar Preset</button>
            </div>
        </nav>
        <main class="content">
            <!-- Aba Network -->
            <div x-show="activeTab=='network'">
                <h2>Configuração de Rede</h2>
                <div class="form-group">
                    <label>UDP Port <input type="number" x-model="config.udpPort"></label>
                    <label>TCP Port <input type="number" x-model="config.tcpPort"></label>
                    <label>Max Connections <input type="range" min="1" :max="maxPits" x-model="config.maxConnections"></label>
                    <label>Register to Lobby <input type="checkbox" x-model="config.registerToLobby"></label>
                    <label>LAN Discovery <input type="checkbox" x-model="config.lanDiscovery"></label>
                    <button @click="save('configuration.json', config)">Salvar</button>
                    <button @click="load('configuration.json')">Recarregar</button>
                </div>
            </div>
            <!-- Aba Server (settings) -->
            <div x-show="activeTab=='server'">
                <h2>Configuração do Servidor</h2>
                <div class="form-group">
                    <label>Nome do Servidor <input type="text" x-model="settings.serverName"></label>
                    <label>Senha (pilotos) <input type="password" x-model="settings.password"></label>
                    <label>Senha Admin <input type="password" x-model="settings.adminPassword"></label>
                    <label>Classe de Carros 
                        <select x-model="settings.carGroup">
                            <template x-for="g in carGroups">
                                <option :value="g" x-text="g"></option>
                            </template>
                        </select>
                    </label>
                    <label>SA Mínimo <input type="range" min="0" max="99" x-model="settings.safetyRatingRequirement"></label>
                    <label>Medalhas da Pista <input type="range" min="0" max="3" x-model="settings.trackMedalsRequirement"></label>
                    <!-- outros campos -->
                    <button @click="save('settings.json', settings)">Salvar</button>
                    <button @click="load('settings.json')">Recarregar</button>
                </div>
            </div>
            <!-- Aba Event (com seletor de pista e sessões) -->
            <div x-show="activeTab=='event'">
                <h2>Evento</h2>
                <div class="track-selector">
                    <template x-for="(info, key) in tracks">
                        <div class="track-card" @click="selectTrack(key)" :class="{selected: event.track==key}">
                            <img :src="'/api/tracks/images/'+key" :alt="info.label" @error="imgError($event)">
                            <span x-text="info.label"></span>
                        </div>
                    </template>
                </div>
                <div class="weather-params">
                    <label>Temp. Ambiente <input type="range" min="-10" max="50" x-model="event.ambientTemp"></label>
                    <label>Nuvens <input type="range" min="0" max="1" step="0.1" x-model="event.cloudLevel"></label>
                    <label>Chuva <input type="range" min="0" max="1" step="0.1" x-model="event.rain"></label>
                    <label>Aleatoriedade <input type="range" min="0" max="10" x-model="event.weatherRandomness"></label>
                </div>
                <div class="sessions">
                    <h3>Sessões</h3>
                    <template x-for="(session, idx) in event.sessions" :key="idx">
                        <div class="session-card">
                            <select x-model="session.sessionType">
                                <option value="P">Practice</option>
                                <option value="Q">Qualify</option>
                                <option value="R">Race</option>
                            </select>
                            <label>Duração (min) <input type="number" x-model="session.sessionDurationMinutes"></label>
                            <label>Hora <input type="number" min="0" max="23" x-model="session.hourOfDay"></label>
                            <label>Dia <select x-model="session.dayOfWeekend">
                                <option value="1">Sexta</option>
                                <option value="2">Sábado</option>
                                <option value="3">Domingo</option>
                            </select></label>
                            <label>Multiplicador <input type="number" min="1" max="24" x-model="session.timeMultiplier"></label>
                            <button @click="removeSession(idx)" class="btn-remove">✕</button>
                        </div>
                    </template>
                    <button @click="addSession()" class="btn-add">+ Adicionar Sessão</button>
                </div>
                <button @click="save('event.json', event)">Salvar Evento</button>
            </div>
            <!-- Aba Rules -->
            <div x-show="activeTab=='rules'">
                <h2>Regras do Evento</h2>
                <!-- Campos de eventRules -->
                <div class="form-group">
                    <label>Pit stops obrigatórios <input type="number" x-model="rules.mandatoryPitstopCount"></label>
                    <label>Janela de pit (seg) <input type="number" x-model="rules.pitwindowLengthSec"></label>
                    <label>Stint máximo (seg) <input type="number" x-model="rules.driverStintTimeSec"></label>
                    <!-- toggles -->
                    <label>Abastecimento permitido <input type="checkbox" x-model="rules.isRefuellingAllowedInRace"></label>
                    <!-- etc -->
                    <button @click="save('eventRules.json', rules)">Salvar Regras</button>
                </div>
            </div>
            <!-- Aba Avançado (entrylist, assistRules, bop) -->
            <div x-show="activeTab=='advanced'">
                <h2>Avançado</h2>
                <p>Em desenvolvimento...</p>
                <!-- Aqui você pode adicionar editors para entrylist, assistRules e bop -->
            </div>
        </main>
    </div>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
